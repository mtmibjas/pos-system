name: desktop_pos
description: Desktop POS application (macOS). Talks to the local-store-server over HTTP/Connect.
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Generated pos.v1 bindings + Connect-Dart clients.
  pos_sdk:
    path: ../../packages/sdk-dart
  # State management — annotation-driven codegen flavor.
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  # Connect-RPC transport. protobuf is pinned by pos_sdk's constraint
  # (^4.1.0); we don't redeclare it here.
  connectrpc: ^1.0.0
  http: ^1.2.0
  # UUID minting for sale_id / line_id / payment_id on Finalize.
  uuid: ^4.0.0
  # Int64 for Money.units; protobuf re-exports fixnum but our app code
  # uses it directly when constructing Money client-side.
  fixnum: ^1.1.0
  # Secure, OS-keystore-backed storage for the session token + device
  # credential (docs/store-server-auth-contract.md §4.2). Windows
  # Credential Manager / macOS Keychain.
  flutter_secure_storage: ^9.2.2
  sqflite_common_ffi: ^2.4.0+3
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Riverpod codegen (run via: dart run build_runner build).
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true

  # Bundled offline-first (no runtime google_fonts fetch — the till must
  # theme correctly with no network). See docs/desktop-pos-ui-design.md §5.
  fonts:
    # Manrope is a variable font; Flutter maps TextStyle.fontWeight through
    # its `wght` axis, so a single file covers 500/700/800.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-var.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500
